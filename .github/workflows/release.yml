name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: 386
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Build Spotique wrapper
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:wrapper

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GOOS" = "windows" ]; then
            EXECUTABLE="spotique.exe"
            ARCHIVE="spotique-${GOOS}-${GOARCH}.zip"
          else
            EXECUTABLE="spotique"
            ARCHIVE="spotique-${GOOS}-${GOARCH}.tar.gz"
          fi

          go build -ldflags "-X main.version=${VERSION}" -o "$EXECUTABLE" .

          if [ "$GOOS" = "windows" ]; then
            cp "$EXECUTABLE" "spotique-${GOOS}-${GOARCH}.exe"
            zip -r -9 "$ARCHIVE" "$EXECUTABLE" CustomApps Extensions Themes jsHelper globals.d.ts css-map.json
          else
            tar -czf "$ARCHIVE" "$EXECUTABLE" CustomApps Extensions Themes jsHelper globals.d.ts css-map.json
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: spotique-${{ matrix.goos }}-${{ matrix.goarch }}
          path: spotique-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Spotique ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*
            install.ps1
            install.sh
